name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      testSuite:
        description: 'Test Suite to run'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - smoke
          - regression
  schedule:
    - cron: '30 20 * * *' # Runs every day at midnight
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      env:
        EVENTHUB_EMAIL: ${{ secrets.EVENTHUB_EMAIL }}
        EVENTHUB_PASSWORD: ${{ secrets.EVENTHUB_PASSWORD }}
      run: |
        if [ "${{ github.event.inputs.testSuite }}" = "smoke" ]; then
          npx playwright test --grep @smoke
        elif [ "${{ github.event.inputs.testSuite }}" = "regression" ]; then
          npx playwright test --grep @regression
        else
          echo "Running all tests"
          npx playwright test
        fi
        else
          echo "push event detected, running all tests"
          npx playwright test
        fi
    - name: Upload Playwright report
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30